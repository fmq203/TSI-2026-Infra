# targets/ — Los activos a proteger: app web vulnerable + DB + host SSH cliente.
# Estos son los servidores/clientes que la consigna propia describe como "activos críticos"
# (RF-01). Llevan agente Wazuh para reportar al HIDS/FIM (RF-04) y son el objetivo de
# los ataques simulados RT-02 (fuerza bruta SSH) y RT-03 (webshell) del Red Team.
#
# ⚠️ Reemplazar DVWA por la app real que defina la consigna propia si el escenario lo pide
# (ej. un e-commerce simulado, portal de trámites, etc.) — DVWA es el placeholder mínimo
# que ya trae vulnerabilidades web conocidas (útil para RT-03 webshell/inyección).

services:
  app-db:
    image: mysql:8.0
    container_name: target-app-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: dvwa
    volumes:
      - target_db_data:/var/lib/mysql
    networks:
      net_srv:
        ipv4_address: ${APP_DB_IP:-10.10.10.11}

  webapp:
    image: vulnerables/web-dvwa:latest
    container_name: target-webapp
    restart: unless-stopped
    depends_on:
      - app-db
    environment:
      MYSQL_HOSTNAME: app-db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set in .env}
    ports:
      - "8081:80"
    networks:
      net_srv:
        ipv4_address: ${WEBAPP_IP:-10.10.10.10}

  ssh-client:
    # Imagen propia (ssh-victim/): OpenSSH en 2222 + agente Wazuh. Blanco de CU-02:
    # la fuerza bruta dispara Active Response (firewall-drop) que bloquea la IP
    # atacante con iptables dentro de este contenedor — por eso NET_ADMIN.
    build: ./ssh-victim
    image: tsi/ssh-victim:4.9.0
    container_name: target-ssh-client
    hostname: ssh-client
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      - SSH_USER=${SSH_TEST_USER:-labuser}
      - SSH_PASSWORD=${SSH_TEST_PASSWORD:?set in .env}   # intencionalmente débil para RT-02, documentar en informe
      - WAZUH_MANAGER=${WAZUH_MANAGER_IP:-10.10.90.10}
    volumes:
      # Conserva client.keys: sin esto, cada recreación del contenedor enrola un agente nuevo.
      - ssh_victim_ossec_etc:/var/ossec/etc
    networks:
      net_usr:
        ipv4_address: ${SSH_CLIENT_IP:-10.10.30.10}

  # webapp (DVWA) todavía sin agente: se suma para CU-03 (FIM sobre /var/www/html).

networks:
  net_srv:
    external: true
  net_usr:
    external: true

volumes:
  target_db_data:
  ssh_victim_ossec_etc:
