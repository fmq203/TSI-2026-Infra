# honeypot/ — Cowrie: honeypot SSH/Telnet (RF-09)
# Detecta reconocimiento/fuerza bruta contra un servicio "trampa" en la DMZ.
# Logs en JSON en el volumen cowrie_logs. PENDIENTE: reenviarlos al SIEM (Wazuh) — todavía
# no hay nada configurado para eso, hoy Wazuh no ve la actividad del honeypot.
# Nota: con red macvlan, `ports:` no hace nada — se llega directo a 10.10.20.30:2222/2223.

services:
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie
    restart: unless-stopped
    ports:
      - "2222:2222"   # SSH honeypot (mapear el 22 real del host víctima al 2222 real de Cowrie si se desea)
      - "2223:2223"   # Telnet honeypot
    volumes:
      - cowrie_logs:/cowrie/cowrie-git/var/log/cowrie
      - cowrie_data:/cowrie/cowrie-git/var/lib/cowrie
    networks:
      # net_dmz = VLAN 20 = 10.10.20.0/24
      net_dmz:
        ipv4_address: ${COWRIE_IP:-10.10.20.30}

networks:
  net_dmz:
    external: true

volumes:
  cowrie_logs:
  cowrie_data:
