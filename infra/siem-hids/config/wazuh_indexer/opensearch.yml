network.host: 0.0.0.0
node.name: wazuh.indexer
cluster.name: wazuh-cluster
discovery.type: single-node
plugins.security.disabled: true
path.data: /var/lib/wazuh-indexer
path.logs: /var/log/wazuh-indexer
# El Filebeat del manager es 7.10.2 y se niega a publicar en un servidor que reporta una
# versión menor (OpenSearch 2.x): se conecta pero nunca crea los índices wazuh-alerts-*
# y el dashboard queda vacío. Esta opción (presente en la config oficial de Wazuh) hace
# que el indexer reporte 7.10.2.
compatibility.override_main_response_version: true
