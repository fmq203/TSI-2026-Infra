# mail/ — docker-mailserver: SMTP propio para el canal de alertas por email (RF-07)
# Un solo contenedor (Postfix+Dovecot+rspamd), mucho más liviano que Mailu (7+ contenedores).
# El SIEM/SOAR envía las alertas contra este servidor (ver siem-hids/.env: SMTP_HOST).

services:
  mailserver:
    image: docker.io/mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail
    domainname: ${MAIL_DOMAIN:-lab.local}
    restart: unless-stopped
    ports:
      - "25:25"
      - "587:587"   # submission (usar este desde el SIEM/SOAR)
      - "993:993"   # IMAPS, para revisar alertas recibidas
    volumes:
      - mail_data:/var/mail-state
      - mail_config:/tmp/docker-mailserver
      # Certificado generado por ./generate-self-signed-cert.sh — SSL_TYPE=self-signed
      # NO lo genera solo, falla ("Missing expected file(s)") si ./ssl/ no existe.
      - ./ssl:/tmp/docker-mailserver/ssl
      - /etc/localtime:/etc/localtime:ro
    environment:
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - PERMIT_DOCKER=network
      - SSL_TYPE=self-signed   # cambiar a letsencrypt/manual si hay TLS real (RNF-04)
    cap_add:
      - NET_ADMIN
    networks:
      net_dmz:
        ipv4_address: ${MAILSERVER_IP:-10.10.20.20}

networks:
  net_dmz:
    external: true

volumes:
  mail_data:
  mail_config:
