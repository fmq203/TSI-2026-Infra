# nids/ — Suricata: IDS de red (RF-03), firmas propias en rules/local.rules (CU-01..CU-05)
#
# ⚠️ Pendiente (ver ../../brain/decisions.md y suricata.yaml): de dónde recibe tráfico
# REAL espejado esta interfaz. Por ahora escucha en su propia red net_dmz (macvlan,
# comparte el mismo bridge físico que mail/honeypot/wazo) — ve tráfico que entra/sale de
# ese segmento, pero no es un mirror explícito del router. Ajustar cuando se resuelva el
# mecanismo de mirroring (port-mirror en Proxmox, o Suricata directo en OPNsense).
#
# Nota: un contenedor solo ve la interfaz de CADA red Docker a la que está conectado, y
# Docker la nombra "eth0" adentro del contenedor (no importa cómo se llame del lado del
# host) — por eso acá hay UNA sola red: con dos o más, Docker numera eth0/eth1/... en el
# orden de conexión y deja de ser predecible cuál es cuál.

services:
  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    command: ["-i", "eth0", "-c", "/etc/suricata/suricata.yaml"]
    volumes:
      # Sin :ro — el entrypoint de la imagen necesita hacer chown de estos paths al
      # arrancar; montados read-only, falla en loop ("Read-only file system").
      - ./suricata.yaml:/etc/suricata/suricata.yaml
      - ./rules:/etc/suricata/rules
      - suricata_logs:/var/log/suricata
    networks:
      net_dmz:
        ipv4_address: ${SURICATA_IP:-10.10.20.50}

networks:
  net_dmz:
    external: true

volumes:
  suricata_logs:
