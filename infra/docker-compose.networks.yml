# Redes compartidas entre todos los stacks. Cada docker-compose.yml de infra/*/ las
# referencia como `external: true`.
#
# ⚠️ Este archivo es solo REFERENCIA/documentación de la config — `docker compose -f
# docker-compose.networks.yml up` NO crea las redes porque no tiene ningún `service`
# (confirmado 2026-10-01: queda "no service selected" y ninguna red se crea). Para
# crearlas de verdad, correr:
#
#   ./create-networks.sh
#
# - Gateway de cada VLAN: .254 (el router).
# - VLAN 10 = Servidores, VLAN 20 = DMZ (no al revés).
# - docker-host tiene 4 NICs, una por VLAN, con IP .5 en cada una. Cada `parent:` de abajo
#   es una interfaz dedicada a UNA sola VLAN (sin trunking 802.1Q dentro del host). Los
#   nombres eth0..eth3 son de ejemplo: create-networks.sh detecta la NIC real por su IP.
# - Reservadas: .254 router, .5 docker-host. Todo contenedor lleva IP fija (ver
#   ../brain/MEMORY.md), porque el IPAM de Docker no sabe de esas dos y podría asignarlas.

networks:
  net_srv:
    name: net_srv
    driver: macvlan
    driver_opts:
      parent: eth0          # NIC de docker-host en la VLAN 10, Servidores
    ipam:
      config:
        - subnet: 10.10.10.0/24
          gateway: 10.10.10.254

  net_dmz:
    name: net_dmz
    driver: macvlan
    driver_opts:
      parent: eth1          # NIC de docker-host en la VLAN 20, DMZ
    ipam:
      config:
        - subnet: 10.10.20.0/24
          gateway: 10.10.20.254

  net_usr:
    name: net_usr
    driver: macvlan
    driver_opts:
      parent: eth2          # NIC de docker-host en la VLAN 30, Usuarios
    ipam:
      config:
        - subnet: 10.10.30.0/24
          gateway: 10.10.30.254

  net_mgmt:
    name: net_mgmt
    driver: macvlan
    driver_opts:
      parent: eth3          # NIC de docker-host en la VLAN 90, Gestión
    ipam:
      config:
        - subnet: 10.10.90.0/24
          gateway: 10.10.90.254
